name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target package --parallel
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: BattleTanx-PC-Linux-x64
          path: |
            build/BattleTanx-PC-*.tar.gz
            build/BattleTanx-PC-*.tar.gz.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cmake --build build --config Release --target package --parallel
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BattleTanx-PC-Windows-x64
          path: |
            build/BattleTanx-PC-*.zip
            build/BattleTanx-PC-*.zip.sha256
          if-no-files-found: error

